name: Deploy migrations

# Applies supabase/migrations/*.sql to the real production project
# (WACRM, ref roxnhmogzvpuyiebfpmt) on every push to main that
# touches a migration file. Separate from the "Migrations" workflow,
# which only replays migrations against a disposable throwaway
# Postgres to check they're valid SQL — it was never wired to touch
# the real database, so every migration in this repo shipped
# unapplied to production until someone ran `supabase db push`
# manually. This is that missing step, automated.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  # Never run two pushes concurrently — db push isn't safe to
  # parallelize against the same database.
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push:
    name: Push to production Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref roxnhmogzvpuyiebfpmt

      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
